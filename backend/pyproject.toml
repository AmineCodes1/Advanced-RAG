[project]
name = "graphrag-backend"
version = "0.1.0"
description = "Local agentic GraphRAG backend"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "langgraph>=0.2,<1.0",
    "langchain-core>=0.3,<1.0",
    "qdrant-client>=1.12,<2.0",
    "fastembed>=0.4,<1.0",
    "flashrank>=0.2,<1.0",
    "neo4j>=5.25,<6.0",
    "python-dotenv>=1.0,<2.0",
    "ollama>=0.4,<1.0",
    "docling>=2.15,<3.0",
    "tiktoken>=0.8,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "langfuse>=2.60,<3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.2,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ingestion", "agent", "graph_import"]
